name: ChatApp
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  ChatApp:
    type: application
    platform: iOS
    sources:
      - Sources
    settings:
      base:
        # Must match the Bundle ID registered in the Apple Developer portal.
        PRODUCT_BUNDLE_IDENTIFIER: com.mengm8200.chat
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: 小聊
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.social-networking
        # Only standard HTTPS/OS crypto: skips the export-compliance prompt in TestFlight.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
schemes:
  ChatApp:
    build:
      targets:
        ChatApp: all
    archive:
      config: Release
